<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="雪道冲刺 POWDER RUSH">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1a4166"/>
      <stop offset="1" stop-color="#050d18"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dbeeff"/>
      <stop offset="1" stop-color="#8fbfe4"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff3d1f"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff5d6"/>
      <stop offset="1" stop-color="#ffcf72"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- 月亮 -->
  <circle cx="46" cy="18" r="6.4" fill="url(#moon)" opacity="0.95"/>

  <!-- 远处雪山 -->
  <path d="M36 35 L48 14 L60.5 35 Z" fill="url(#snow)" opacity="0.38"/>

  <!-- 主雪山 -->
  <path d="M1 56 L23 19 L37.5 42 L46 29.5 L63 56 Z" fill="url(#snow)"/>
  <path d="M23 19 L16.5 30 L20.4 28.4 L23.6 32.6 L27.2 27.8 L30.4 30 Z" fill="#ffffff" opacity="0.9"/>

  <!-- 雪道（由山顶向下展开） -->
  <path d="M23.4 24.6 C27.2 29.6 24.2 33.6 26.6 38.4 C28.8 43 25.4 48 31.5 56 L16 56 C19.2 48 17.2 42.6 19.8 37.6 C21.8 32.6 21 28.6 23.4 24.6 Z"
        fill="url(#trail)"/>
  <path d="M24 28 C26.6 32 24.4 35.4 26.2 39.8 C27.8 43.6 25.2 47.6 27.6 52.6"
        fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.35"/>

  <!-- 滑雪者 -->
  <circle cx="21.6" cy="47.4" r="1.9" fill="#0a1d30"/>
  <path d="M21.6 49 L20.4 52" stroke="#0a1d30" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M18.4 52.8 L22.6 52.4" stroke="#0a1d30" stroke-width="1.4" stroke-linecap="round"/>

  <!-- 雪点 -->
  <circle cx="11.5" cy="17" r="1.3" fill="#ffffff" opacity="0.75"/>
  <circle cx="19.5" cy="10" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="56.5" cy="25" r="1.1" fill="#ffffff" opacity="0.5"/>
  <circle cx="9" cy="29" r="0.9" fill="#ffffff" opacity="0.4"/>
</svg>
